name: TEMP controlled dip high-rate review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Prepare source-only review sheets
        run: |
          set -euo pipefail
          mkdir -p build/controlled-dip-review
          URL='https://www.pexels.com/download/video/34568748/'
          curl -L --fail --retry 3 --retry-all-errors \
            -H 'User-Agent: Mozilla/5.0 HangInThere/0.1 test-only temporal review' \
            -H 'Referer: https://www.pexels.com/video/dynamic-workout-man-exercising-on-parallel-bars-34568748/' \
            "$URL" -o build/controlled-dip-review/source.mp4
          test "$(wc -c < build/controlled-dip-review/source.mp4 | tr -d ' ')" = '5319143'
          echo '48bbb11b9929cb4caea2b042dea46d0f7c717b92f0842a93d4165cf73d3c3afc  build/controlled-dip-review/source.mp4' | sha256sum -c -
          ffmpeg -v error -y -i build/controlled-dip-review/source.mp4 \
            -vf 'fps=8,scale=180:-2:flags=lanczos,tile=6x4:padding=2:margin=2' \
            -frames:v 4 build/controlled-dip-review/sheet-%02d.jpg
          ffmpeg -v error -y -i build/controlled-dip-review/source.mp4 \
            -vf 'fps=8,scale=480:-2:flags=lanczos,setsar=1' -an \
            -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p \
            build/controlled-dip-review/review-8fps.mp4
      - name: Upload visual-review media
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temp-controlled-dip-high-rate-review
          retention-days: 1
          path: build/controlled-dip-review/
