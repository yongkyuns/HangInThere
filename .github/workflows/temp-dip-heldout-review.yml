name: TEMP held-out dip review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Download and prepare held-out dip candidates
        run: |
          set -euo pipefail
          mkdir -p build/dip-heldout

          prepare() {
            id="$1"
            url="$2"
            input="build/dip-heldout/${id}-source.mp4"
            curl -L --fail --retry 3 --retry-all-errors "$url" -o "$input"
            echo "=== $id ==="
            wc -c "$input"
            sha256sum "$input"
            ffprobe -v error -show_entries format=duration -show_entries stream=width,height,avg_frame_rate -of json "$input"
            ffmpeg -v error -y -i "$input" \
              -vf 'fps=8,scale=320:-2:flags=lanczos,tile=8x8:padding=2:margin=2' \
              -frames:v 1 "build/dip-heldout/${id}-contact.jpg"
            ffmpeg -v error -y -i "$input" \
              -vf 'fps=8,scale=640:640:force_original_aspect_ratio=decrease:force_divisible_by=2,setsar=1' \
              -an -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p \
              "build/dip-heldout/${id}-review.mp4"
          }

          prepare ketut-4804769 'https://videos.pexels.com/video-files/4804769/4804769-uhd_3840_2160_25fps.mp4'
          prepare romina-5046452 'https://videos.pexels.com/video-files/5046452/5046452-hd_1920_1080_30fps.mp4'
      - name: Upload held-out dip review media
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temp-dip-heldout-review
          retention-days: 1
          path: build/dip-heldout/
