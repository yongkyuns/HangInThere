name: Native Penn intake
on:
  push:
    branches: [ops/penn-intake-20260926]
permissions:
  contents: read
concurrency:
  group: native-penn-intake-${{ github.ref }}
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install existing host-only importer dependencies
        run: |
          python3 -m venv /tmp/hit-native-env
          /tmp/hit-native-env/bin/python -m pip install --only-binary=:all: -r Evaluation/import-requirements.txt
          echo '/tmp/hit-native-env/bin' >> "$GITHUB_PATH"
      - name: Inspect actual native action names and archive documentation
        run: |
          mkdir -p build
          python3 -u - <<'PY' 2>&1 | tee build/native-intake.txt
          import sys, json
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import evaluation as ev
          import stage_penn as intake
          archive = Path('Data/external/Penn_Action.tar.gz')
          acquisition = intake.download(archive)
          ev.write_json('build/penn-acquisition.json', acquisition)
          print('Acquired publisher archive:', json.dumps(acquisition), flush=True)
          inventory = intake.inspect_archive(archive)
          ev.write_json('build/penn-inventory.json', inventory)
          print('Native action counts:', json.dumps(inventory['counts_by_action']), flush=True)
          # Inspect source documentation/code only; never upload image or joint-array bytes.
          evidence = []
          for tar, item, path in intake.members(archive):
              if path.name.lower() in {'readme', 'readme.txt', 'license', 'license.txt', 'visualize.m'} and item.size <= 65536:
                  content = tar.extractfile(item).read().decode('utf-8', errors='replace')
                  evidence.append({'path': str(path), 'text': content})
          ev.write_json('build/penn-documentation.json', evidence)
          print('Recorded native metadata only. No model inference, permissions or action aliases inferred.')
          PY
      - name: Retain diagnostic metadata only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-penn-intake-metadata
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/native-intake.txt
            build/penn-acquisition.json
            build/penn-inventory.json
            build/penn-documentation.json
