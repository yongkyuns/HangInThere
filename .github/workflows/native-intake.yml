name: Native Penn intake
# Isolated execution branch; not the PR's manual-only workflow.
on:
  push:
    branches: [ops/penn-intake-20260926]
permissions:
  contents: read
concurrency:
  group: native-penn-intake-${{ github.ref }}
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install existing host-only importer dependencies
        run: |
          python3 -m venv /tmp/hit-native-env
          /tmp/hit-native-env/bin/python -m pip install --only-binary=:all: -r Evaluation/import-requirements.txt
          echo '/tmp/hit-native-env/bin' >> "$GITHUB_PATH"
      - name: Test native intake and conversion contracts
        run: python3 -m unittest discover -s Evaluation/tests -v
      - name: Acquire pinned archive and stage six original sequences
        run: |
          set -o pipefail
          mkdir -p build
          python3 -u scripts/stage_penn.py --archive Data/external/Penn_Action.tar.gz --fetch --output Data/local/penn-intake --limit 6 --sha256 e3e41bd99deb7b3beb9785f78b209de272bb0fa60ff4432ffa88118907a797de 2>&1 | tee build/native-intake.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('Data/local/penn-intake/intake-report.json').read_text())
          assert d['native_annotations_inspected']==2326 and d['pull_up_candidates']==199
          assert d['selected_sequence_ids']==['1149','1150','1151','1152','1153','1154']
          assert d['selected_frames']==271
          print('Native six-sequence staging confirmed; no model inference or permission approval.')
          PY
      - name: Encrypt the selected review copy before artifact transfer
        # Only a public recipient certificate is present here. The private key
        # stays in the active review session, never in GitHub, logs or artifacts.
        run: |
          cat > "$RUNNER_TEMP/review-recipient.pem" <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEPzCCAqegAwIBAgIUUi5FJ0PtrUs0j1jf3tInb5BekegwDQYJKoZIhvcNAQEL
          BQAwLzEtMCsGA1UEAwwkSGFuZ0luVGhlcmUgZXBoZW1lcmFsIGRhdGFzZXQgcmV2
