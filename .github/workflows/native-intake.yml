          tar -czf "$RUNNER_TEMP/native-review.tgz" -C Data/local/penn-intake .
          openssl cms -encrypt -binary -aes256 -outform DER -in "$RUNNER_TEMP/native-review.tgz" -out build/penn-review.p7m "$RUNNER_TEMP/review-recipient.pem"
          rm "$RUNNER_TEMP/native-review.tgz" "$RUNNER_TEMP/review-recipient.pem"
      - name: Transfer encrypted private review copy only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-penn-encrypted-review
          retention-days: 1
          if-no-files-found: error
          path: build/penn-review.p7m
      - name: Retain non-media intake metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-penn-intake-metadata
          retention-days: 7
          path: |
            build/native-intake.txt
            Data/local/penn-intake/intake-report.json
            Data/local/penn-intake/acquisition.json
