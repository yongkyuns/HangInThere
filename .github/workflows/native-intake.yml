name: Native Penn intake

# One-off acquisition branch only. The proposed PR keeps workflow_dispatch.
on:
  push:
    branches: [ops/penn-intake-20260926]
permissions:
  contents: read
concurrency:
  group: native-penn-intake-${{ github.ref }}
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install existing host-only importer dependencies
        run: |
          python3 -m venv /tmp/hit-native-env
          /tmp/hit-native-env/bin/python -m pip install --only-binary=:all: -r Evaluation/import-requirements.txt
          echo '/tmp/hit-native-env/bin' >> "$GITHUB_PATH"
      - name: Test native intake and conversion contracts
        run: python3 -m unittest discover -s Evaluation/tests -v
      - name: Acquire and stage six original pull-up sequences for review
        run: |
          set -o pipefail
          mkdir -p build
          python3 -u scripts/stage_penn.py --archive Data/external/Penn_Action.tar.gz --fetch --output Data/local/penn-intake --limit 6 2>&1 | tee build/native-intake.txt
      - name: Retain metadata only; no images, native labels, or accuracy claims
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-penn-intake-metadata
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/native-intake.txt
            Data/local/penn-intake/intake-report.json
            Data/local/penn-intake/acquisition.json
