name: Native Penn intake
# Isolated diagnostics only; never a normal PR workflow.
on:
  push:
    branches: [ops/penn-intake-20260926]
permissions:
  contents: read
concurrency:
  group: native-penn-intake-${{ github.ref }}
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host-only importer dependencies
        run: |
          python3 -m venv /tmp/hit-native-env
          /tmp/hit-native-env/bin/python -m pip install --only-binary=:all: -r Evaluation/import-requirements.txt
          echo '/tmp/hit-native-env/bin' >> "$GITHUB_PATH"
      - name: Inspect originals without approving mismatched geometry
        run: |
          set -o pipefail
          mkdir -p build
          openssl x509 -in scripts/review-recipient.pem -noout
          python3 -u scripts/diagnose_penn.py 2>&1 | tee build/native-intake.txt
      - name: Encrypt selected originals for private inspection
        run: |
          tar -czf "$RUNNER_TEMP/native-review.tgz" -C Data/local/penn-intake .
          openssl cms -encrypt -binary -aes256 -outform DER -in "$RUNNER_TEMP/native-review.tgz" -out build/penn-review.p7m scripts/review-recipient.pem
          rm "$RUNNER_TEMP/native-review.tgz"
      - name: Transfer encrypted private review copy only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-penn-encrypted-review
          retention-days: 1
          if-no-files-found: error
          path: build/penn-review.p7m
      - name: Retain non-media diagnostic metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-penn-intake-metadata
          retention-days: 7
          path: |
            build/native-intake.txt
            Data/local/penn-intake/intake-report.json
            Data/local/penn-intake/acquisition.json
