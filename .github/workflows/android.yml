name: Android parity
on:
  push:
    branches: [main, 'codex/android-parity']
  pull_request:
  workflow_dispatch:
    inputs:
      pose_mode_diagnostic:
        description: Compare VIDEO tracking and IMAGE redetection on identical public pixels
        type: boolean
        default: false
      pose_crop_diagnostic:
        description: Compare the pinned model on full frames and bounded person crops (includes VIDEO/IMAGE comparison)
        type: boolean
        default: false
      selected_pose_diagnostic:
        description: Export shipping SDK observations for every frame of the four frozen public videos
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  hdr-decoder-host:
    name: Software HDR decoder contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install source build tools
        run: sudo apt-get update -qq && sudo apt-get install -y autoconf automake libtool pkg-config
      - name: Compile pinned codec sources and test production decoder
        run: python3 scripts/test-hdr-decoder.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: hdr-host-build-diagnostics
          path: |
            build/android-hdr/host/build.log
            build/android-hdr/host/ffmpeg/ffbuild/config.log
  shared-parity:
    name: Swift and Kotlin policy parity
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Generate snapshots using production Swift policies
        run: |
          PLATFORM_NAME=macosx CONFIGURATION=Debug scripts/build-workout-core.sh
          python3 scripts/prepare-workout-oracle.py
          python3 scripts/prepare-setup-oracle.py
      - name: Test shared engine and compare every frame
        env:
          WORKOUT_ORACLE: ${{ github.workspace }}/build/workout-oracle/oracle.json
          WORKOUT_PARITY_REPORT: ${{ github.workspace }}/build/workout-oracle/kotlin-parity.json
          SETUP_ORACLE: ${{ github.workspace }}/build/setup-oracle/oracle.json
        run: ./gradlew :shared:jvmTest :shared:linkDebugFrameworkIosSimulatorArm64 --console=plain
      - name: Check core performance budget
        run: python3 scripts/check-android-evaluation.py --core build/workout-oracle/kotlin-parity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shared-parity
          if-no-files-found: error
          path: |
            build/workout-oracle/oracle.json
            build/workout-oracle/kotlin-parity.json
            build/setup-oracle/oracle.json
            shared/build/test-results/jvmTest/*.xml
  emulator:
    name: Native Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1
          log-accepted-android-sdk-licenses: false
      - name: Prepare pinned public media and model
        env:
          SELECTED_POSE_DIAGNOSTIC: ${{ inputs.selected_pose_diagnostic == true && 'true' || 'false' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg autoconf automake libtool pkg-config
          python3 -m unittest discover -s scripts/tests -p 'test_android*.py' -v
          fixture_arguments=()
          if [[ "$SELECTED_POSE_DIAGNOSTIC" == "true" ]]; then fixture_arguments+=(--selected-pose-diagnostic); fi
          python3 scripts/prepare-android-fixtures.py "${fixture_arguments[@]}"
      - name: Compile APK, check lint and host regressions
        run: ./gradlew :android:app:assembleDebug :android:app:assembleDebugAndroidTest :android:app:lintDebug :android:app:testDebugUnitTest --console=plain
      - name: Verify actual packaged native model and emulator ABI
        run: python3 scripts/check-android-apk.py android/app/build/outputs/apk/debug/app-debug.apk --ndk "$ANDROID_HOME/ndk/28.2.13676358" --output build/android-evaluation/apk-provenance.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual decoder, MediaPipe CPU and OpenCV evaluation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          POSE_MODE_DIAGNOSTIC: ${{ inputs.pose_mode_diagnostic == true && 'true' || 'false' }}
          POSE_CROP_DIAGNOSTIC: ${{ inputs.pose_crop_diagnostic == true && 'true' || 'false' }}
          SELECTED_POSE_DIAGNOSTIC: ${{ inputs.selected_pose_diagnostic == true && 'true' || 'false' }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-android-evaluation.sh
      - name: Check required positive, native mechanics and emulator budgets
        if: always()
        run: python3 scripts/check-android-evaluation.py --native build/android-evaluation/report.json
      - name: Verify complete selected-source native pose export
        if: ${{ always() && inputs.selected_pose_diagnostic == true }}
        run: python3 scripts/check-selected-pose-export.py build/android-evaluation
      - name: Verify identical-pixel pose comparison evidence
        if: ${{ always() && inputs.pose_mode_diagnostic == true && inputs.pose_crop_diagnostic != true }}
        run: python3 scripts/check-android-evaluation.py --pose-modes build/android-evaluation/pose-mode-report.json
      - name: Verify bounded-crop inference evidence in original coordinates
        if: ${{ always() && inputs.pose_crop_diagnostic == true }}
        run: python3 scripts/check-android-evaluation.py --pose-modes build/android-evaluation/pose-crop-report.json
      - name: Check real-pixel Auto acquisition and live countdown
        if: always()
        run: python3 scripts/check-android-evaluation.py --setup build/android-evaluation/setup-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: android-api-${{ matrix.api }}
          if-no-files-found: error
          # Explicit whitelist: test APK/source videos/model assets must not be redistributed.
          path: |
            build/android-evaluation/*.json
            build/android-evaluation/*.jsonl
            build/android-evaluation/*.png
            build/android-evaluation/*.txt
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/androidTest-results/connected/**/*.xml
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/lint-results-debug.html
      - name: Publish matching HDR library sources and build recipe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: android-hdr-source-api-${{ matrix.api }}
          if-no-files-found: error
          path: |
            build/android-hdr/sources/ffmpeg.tar.xz
            build/android-hdr/sources/zimg.tar.gz
            build/android-hdr/*/complete.json
            build/android-hdr/*/build.log
            build/android-hdr/*/ffmpeg/ffbuild/config.log
            scripts/build-android-hdr.py
            android/app/src/main/cpp/*
            android/app/src/main/assets/licenses/*
            docs/ANDROID-HDR.md
  fixture-inputs:
    name: Identical public evaluation inputs
    needs: emulator
    if: ${{ !cancelled() && needs.emulator.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: android-api-*
          path: build/fixture-inputs
      - name: Compare native-verified dynamic and held-setup media
        run: |
          python3 scripts/check-android-evaluation.py --matching-inputs \
            build/fixture-inputs/android-api-29/build/android-evaluation/report.json \
            build/fixture-inputs/android-api-35/build/android-evaluation/report.json

  native-policy-parity:
    name: Swift replay of Android model observations
    needs: emulator
    # Replay failed accuracy runs too, but never hold superseded runs open on cancellation.
    if: ${{ !cancelled() && needs.emulator.result != 'cancelled' }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: android-api-${{ matrix.api }}
          path: build/android-native
      - name: Compare native-observation counts and events against Swift
        run: python3 scripts/compare-android-observations.py build/android-native/build/android-evaluation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-swift-api-${{ matrix.api }}
          if-no-files-found: error
          path: |
            build/android-native/build/android-evaluation/swift-native-parity.json
            build/android-native/build/android-evaluation/swift-crop-parity.json

  original-capture-accuracy:
    name: Original capture accuracy diagnostics
    needs: emulator
    # Intentionally red while original 1/9 movement labels fail. No continue-on-error.
    # Required engineering gates are the separately named policy/native jobs.
    if: ${{ !cancelled() && needs.emulator.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: android-api-${{ matrix.api }}
          path: build/android-native
      - name: Preserve original movement accuracy failures
        run: python3 scripts/check-android-evaluation.py --accuracy build/android-native/build/android-evaluation/report.json
