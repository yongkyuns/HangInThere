name: TEMP dip timing development

on:
  pull_request:

permissions:
  contents: read

jobs:
  timing:
    name: Consumed dip timing regression
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare consumed development clips
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          root=pathlib.Path('.')
          out=root/'Data/local/dip-timing-development'
          out.mkdir(parents=True)

          cases=[
            ('romina', json.loads((root/'HangInThereTests/Fixtures/dip-heldout.json').read_text())['case']),
            ('pavel', json.loads((root/'HangInThereTests/Fixtures/dip-heldout-v2.json').read_text())['case']),
          ]
          for name,c in cases:
              p=out/(name+'-source.mp4')
              req=urllib.request.Request(c['download_url'], headers={
                  'User-Agent':'Mozilla/5.0 HangInThere/0.1 consumed-dip-timing-development',
                  'Referer':c['source_page'],
              })
              with urllib.request.urlopen(req, timeout=120) as r, p.open('wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      f.write(b)
              data=p.read_bytes()
              assert len(data)==c['source_bytes']
              assert hashlib.sha256(data).hexdigest()==c['source_sha256']
          PY
          ffmpeg -v error -y -i Data/local/dip-timing-development/romina-source.mp4 \
            -t 3.375 -vf 'fps=8,scale=640:-2:flags=lanczos' -an \
            -c:v libx264 -crf 18 -preset veryfast \
            Data/local/dip-timing-development/romina.mp4
          ffmpeg -v error -y -i Data/local/dip-timing-development/pavel-source.mp4 \
            -t 14 -vf 'fps=8,scale=640:-2:flags=lanczos' -an \
            -c:v libx264 -crf 18 -preset veryfast \
            Data/local/dip-timing-development/pavel.mp4
          test "$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 Data/local/dip-timing-development/romina.mp4)" = "27"
          test "$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 Data/local/dip-timing-development/pavel.mp4)" = "112"
          rm Data/local/dip-timing-development/*-source.mp4
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('Data/local/dip-timing-development')
          clips=[]
          for name,nframes in [('romina',27),('pavel',112)]:
              p=root/(name+'.mp4')
              clips.append({
                'id':name+'_consumed_timing_development',
                'dataset':'consumed-dip-timing-development-v1',
                'exercise':'parallel_bar_dip',
                'split':'development',
                'source_group':'Pexels-'+('5046452' if name=='romina' else '4065479'),
                'subject_group':name+'-consumed',
                'rights':{'status':'approved','evidence':'Pexels; consumed development evidence only.','public_outputs':True},
                'media':{'kind':'video','files':[{'path':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}],
                         'expected_frames':nframes}
              })
          (root/'manifest.json').write_text(json.dumps({'schema_version':1,'clips':clips},indent=2)+'\n')
          PY
      - name: Run exact production Apple Vision
        run: |
          ./scripts/evaluate.sh Data/local/dip-timing-development/manifest.json \
            --root Data/local/dip-timing-development \
            --output Evaluation/output/dip-timing-development \
            --public-output
      - name: Replay policy v7 and verify consumed development expectations
        run: |
          ./scripts/count-replay.sh \
            Evaluation/output/dip-timing-development/romina_consumed_timing_development/observations.jsonl \
            dip left Evaluation/output/romina-timing-v7.json \
            410 202 600 202
          ./scripts/count-replay.sh \
            Evaluation/output/dip-timing-development/pavel_consumed_timing_development/observations.jsonl \
            dip right Evaluation/output/pavel-timing-v7.json \
            20 315 620 290
          python3 - <<'PY'
          import json
          from pathlib import Path
          romina=json.loads(Path('Evaluation/output/romina-timing-v7.json').read_text())
          pavel=json.loads(Path('Evaluation/output/pavel-timing-v7.json').read_text())
          for r,frames in [(romina,27),(pavel,112)]:
              s=r['summary']
              assert r['frames']==frames
              assert s['policyVersion']==7
              assert s['observedMovements']==3
              assert s['partialAttempts']==0
              assert s['interruptedAttempts']==0
          holdout=json.loads(Path('HangInThereTests/Fixtures/dip-heldout-v2.json').read_text())
          windows=holdout['case']['event_windows_source_seconds']
          events=[e['sourceSeconds'] for e in pavel['events'] if e['outcome']=='movement']
          print('Romina v7 events:', [e['sourceSeconds'] for e in romina['events'] if e['outcome']=='movement'])
          print('Pavel v7 events:', events)
          assert len(events)==len(windows)==3
          assert all(a <= t <= b for t,(a,b) in zip(events,windows)), (events,windows)
          PY
      - name: Retain consumed timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temp-dip-timing-development-v7
          retention-days: 2
          if-no-files-found: warn
          path: |
            Evaluation/output/dip-timing-development/report.json
            Evaluation/output/dip-timing-development/*/completion.json
            Evaluation/output/dip-timing-development/*/observations.jsonl
            Evaluation/output/romina-timing-v7.json
            Evaluation/output/pavel-timing-v7.json
