name: TEMP Yokota corpus review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Download, pin and prepare Yokota review media
        run: |
          set -euo pipefail
          URL='https://upload.wikimedia.org/wikipedia/commons/8/8d/PACUP_-_Yokota_February_Samurai_Fitness_Challenge_%28998462%29.webm'
          mkdir -p build/yokota-review
          curl -L --fail --retry 3 "$URL" -o build/yokota-review/source.webm
          wc -c build/yokota-review/source.webm
          sha256sum build/yokota-review/source.webm
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 build/yokota-review/source.webm
          ffmpeg -v error -y -i build/yokota-review/source.webm             -vf 'fps=2,scale=320:-2:flags=lanczos,tile=5x4:padding=2:margin=2'             -frames:v 1 build/yokota-review/contact.jpg
          ffmpeg -v error -y -i build/yokota-review/source.webm             -vf 'fps=4,scale=640:-2:flags=lanczos,setsar=1' -an             -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p             build/yokota-review/review.mp4
      - name: Upload Yokota visual-review media
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temp-yokota-review
          retention-days: 1
          path: build/yokota-review/
