name: Review temporal dip source
on:
  push:
    branches: [ops/review-temporal-dips-20260927]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare review tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv /tmp/review-env
          /tmp/review-env/bin/pip install --only-binary=:all: Pillow==12.3.0
      - name: Review bounded public video without model inference
        run: |
          /tmp/review-env/bin/python - <<'PY'
          import hashlib, json, subprocess, urllib.request
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('build/temporal-review');root.mkdir(parents=True)
          url='https://d34w7g4gy10iej.cloudfront.net/video/2305/DOD_109654583/DOD_109654583.mp4'
          page='https://www.dvidshub.net/video/884241/aaw23-fittest-all-american-challenge'
          source=Path('/tmp/dip-review-original.mp4')
          h=hashlib.sha256();total=0
          req=urllib.request.Request(url,headers={'User-Agent':'HangInThere/0.1 exercise evaluation'})
          with urllib.request.urlopen(req,timeout=120) as response, source.open('wb') as out:
              declared=response.headers.get('Content-Length')
              while block:=response.read(1024*1024):
                  total+=len(block)
                  if total>700_000_000:raise ValueError('Source exceeds bounded review limit')
                  h.update(block);out.write(block)
          if declared is not None and total!=int(declared):raise ValueError('Truncated source')
          def probe(path):
              return json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_streams','-show_frames','-show_entries','stream=width,height,codec_name,time_base,duration:frame=best_effort_timestamp_time','-of','json',str(path)]))
          original=probe(source)
          subprocess.run(['ffmpeg','-v','error','-i',str(source),'-map','0:v:0','-vf','scale=960:-2','-c:v','libx264','-crf','20','-preset','veryfast','-an','-fps_mode','passthrough','-enc_time_base','1:90000','-video_track_timescale','90000',str(root/'review.mp4')],check=True)
          derived=probe(root/'review.mp4')
          a=[float(f['best_effort_timestamp_time']) for f in original['frames']]
          b=[float(f['best_effort_timestamp_time']) for f in derived['frames']]
          assert len(a)==len(b) and a and max(abs((x-a[0])-(y-b[0])) for x,y in zip(a,b))<.002
          record={'page':page,'url':url,'source_sha256':h.hexdigest(),'source_bytes':total,'source_streams':original['streams'],'source_pts_seconds':a,'review_sha256':hashlib.sha256((root/'review.mp4').read_bytes()).hexdigest(),'review_pts_seconds':b,'scope':'Visual review proxy only; no model inference or exercise labels'}
          (root/'source.json').write_text(json.dumps(record,indent=2)+'\n')
          thumbs=root/'thumbs';thumbs.mkdir()
          subprocess.run(['ffmpeg','-v','error','-i',str(root/'review.mp4'),'-vf','fps=1/5,scale=320:-2','-start_number','0',str(thumbs/'%04d.jpg')],check=True)
          files=sorted(thumbs.glob('*.jpg'));w,h=Image.open(files[0]).size
          sheet=Image.new('RGB',(w*5,(h+24)*((len(files)+4)//5)),'white');draw=ImageDraw.Draw(sheet)
          for i,p in enumerate(files):
              x=(i%5)*w;y=(i//5)*(h+24);sheet.paste(Image.open(p),(x,y));draw.text((x+5,y+h+3),f'overview sample {i}; near {5*i}s',fill='black')
          sheet.save(root/'overview.jpg')
          (root/'ATTRIBUTION.txt').write_text('AAW23 - Fittest All American Challenge. U.S. Army video by Sgt. Jacob Moir / 49th Public Affairs Detachment. DVIDS 884241; VIRIN 230523-A-JM069-001; 2023-05-23. '+page+'\nListed PUBLIC DOMAIN by publisher; https://www.dvidshub.net/about/copyright\nThe appearance of U.S. Department of War (DoW) visual information does not imply or constitute DoW endorsement.\nResized/re-encoded silent review proxy and thumbnails. Test-only evaluation, not endorsement, advertising, identity recognition or model training. Publicity and trademark rights are not waived.\n')
          print(json.dumps({k:v for k,v in record.items() if not k.endswith('pts_seconds')},indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: temporal-dip-source-review
          retention-days: 3
          if-no-files-found: error
          path: build/temporal-review
