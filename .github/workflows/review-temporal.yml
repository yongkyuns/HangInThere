name: Review temporal dip source
on:
  push:
    branches: [ops/review-temporal-dips-20260927]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare review tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv /tmp/review-env
          /tmp/review-env/bin/pip install --only-binary=:all: Pillow==12.3.0
      - name: Inspect public streaming source without pose inference
        run: |
          /tmp/review-env/bin/python - <<'PY'
          import hashlib, html, json, re, subprocess, urllib.request, urllib.parse
          from pathlib import Path
          from PIL import Image, ImageDraw
          root = Path('build/temporal-review'); root.mkdir(parents=True)
          page = 'https://www.dvidshub.net/video/884241/aaw23-fittest-all-american-challenge'
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'HangInThere/0.1 exercise evaluation'}), timeout=90)
          with get(page) as response: text = response.read(2_000_000).decode('utf-8')
          (root/'page.html').write_text(text)
          text = html.unescape(text.replace('\\/', '/'))
          urls = sorted(set(re.findall(r'https://[^\s\"\'<>]+\.mp4(?:\?[^\s\"\'<>]*)?', text)))
          urls = [u for u in urls if urllib.parse.urlparse(u).hostname.endswith(('.dvidshub.net','.cloudfront.net'))]
          print('Public streaming candidates:', json.dumps(urls))
          if not urls: raise SystemExit('No public MP4 source; do not use authenticated download endpoints')
          candidates=[]
          for url in urls:
              req=urllib.request.Request(url, method='HEAD', headers={'User-Agent':'HangInThere/0.1 exercise evaluation'})
              with urllib.request.urlopen(req,timeout=60) as response: size=int(response.headers.get('Content-Length',0))
              if 0 < size <= 250_000_000: candidates.append((size,url))
          if not candidates: raise SystemExit('No bounded source available')
          expected,url=min(candidates)
          source=root/'original.mp4'
          with get(url) as response, source.open('wb') as stream:
              total=0
              while block:=response.read(1024*1024):
                  total+=len(block)
                  if total>250_000_000: raise ValueError('Source too large')
                  stream.write(block)
          assert source.stat().st_size==expected
          metadata=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(source)]))
          (root/'source.json').write_text(json.dumps({'page':page,'url':url,'sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'bytes':expected,'probe':metadata},indent=2)+'\n')
          thumbs=root/'thumbs';thumbs.mkdir()
          subprocess.run(['ffmpeg','-v','error','-i',str(source),'-vf','fps=1/5,scale=320:-2','-start_number','0',str(thumbs/'%04d.jpg')],check=True)
          files=sorted(thumbs.glob('*.jpg')); w,h=Image.open(files[0]).size
          sheet=Image.new('RGB',(w*5,(h+24)*((len(files)+4)//5)), 'white'); draw=ImageDraw.Draw(sheet)
          for i,p in enumerate(files):
              x=(i%5)*w;y=(i//5)*(h+24);sheet.paste(Image.open(p),(x,y));draw.text((x+5,y+h+3),f'overview sample {i}; near {5*i}s',fill='black')
          sheet.save(root/'overview.jpg')
          (root/'ATTRIBUTION.txt').write_text('AAW23 - Fittest All American Challenge. U.S. Army video by Sgt. Jacob Moir / 49th Public Affairs Detachment. DVIDS ID 884241, VIRIN 230523-A-JM069-001, 2023-05-23. '+page+'\nListed PUBLIC DOMAIN by publisher. https://www.dvidshub.net/about/copyright\nThe appearance of U.S. Department of War (DoW) visual information does not imply or constitute DoW endorsement.\nTest-only review; no advertising, endorsement, identity recognition or model training. Publicity/trademark rights are not waived. Derived resized review thumbnails, no inferred landmarks.\n')
          print((root/'source.json').read_text())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: temporal-dip-source-review
          retention-days: 3
          if-no-files-found: error
          path: build/temporal-review
