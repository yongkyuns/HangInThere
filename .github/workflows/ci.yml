name: iOS P0

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Simulator tests and unsigned device build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify selected toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Core geometry and timeline tests
        run: ./scripts/test-core.sh
      - name: Prepare pinned real-human smoke media
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 scripts/prepare-fixtures.py
      - name: Build device target and run simulator tests
        run: ./scripts/test-ios.sh
      - name: Retain test results and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p0-test-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/SimulatorTests.xcresult
            build/*.txt
            HangInThereTests/Fixtures/generated/prepared.json
      # Only the pinned, public-domain test derivative is exported. Never glob
      # user recordings or the app's Documents/temporary import directories.
      - name: Retain approved smoke fixture for visual review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p0-smoke-fixture
          retention-days: 7
          if-no-files-found: warn
          path: |
            HangInThereTests/Fixtures/source.json
            HangInThereTests/Fixtures/generated/prepared.json
            HangInThereTests/Fixtures/generated/pullup-smoke.png
            HangInThereTests/Fixtures/generated/pullup-smoke.mp4
