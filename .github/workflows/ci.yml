name: iOS P0
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    name: Simulator tests and device compilation
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare explicitly licensed real-video fixture
        run: python3 scripts/prepare-fixtures.py
      - name: Run simulator geometry, replay, and real Vision tests
        run: bash scripts/ci.sh
      - name: Compile physical-device target without signing
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build
          status=0
          xcodebuild build -project HangInThere.xcodeproj -scheme HangInThere \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO > build/device.log 2>&1 || status=$?
          grep -E 'error:|warning:|\*\* BUILD' build/device.log || true
          if [ "$status" -ne 0 ]; then tail -80 build/device.log; fi
          exit "$status"
      - name: Retain diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-test-results
          path: |
            build/*.log
            build/simulators.json
            build/SimulatorTests.xcresult
          if-no-files-found: warn
          retention-days: 7
