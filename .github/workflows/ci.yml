name: Vision runtime probe

on:
  push:
    branches: [ops/vision-runtime-probe-20260927]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vision-runtime-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vision:
    name: Real Vision / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: intel-xcode26.3
            runner: macos-15-intel
            xcode: '26.3'
          - label: arm64-xcode26.6
            runner: macos-26
            xcode: '26.6'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - name: Checkout probe and parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify unchanged production and test code
        run: |
          mkdir -p build
          git diff --exit-code 01706081a2f72bd70cf0cee823e8ae23e678d338 HEAD -- HangInThere HangInThereTests HangInThere.xcodeproj scripts Evaluation
          git rev-parse HEAD HEAD^{tree} | tee build/probe-source.txt
          git ls-tree -r HEAD -- HangInThere HangInThereTests scripts | tee -a build/probe-source.txt
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee build/probe-environment.txt
          sw_vers | tee -a build/probe-environment.txt
          uname -m | tee -a build/probe-environment.txt
          xcrun simctl list runtimes --json > build/probe-runtimes.json
      - name: Prepare identical pinned real-human fixture
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 scripts/prepare-fixtures.py
      - name: Run unchanged real-Vision suite
        run: ./scripts/test-ios.sh vision
      - name: Retain test results without changing failure status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vision-probe-${{ matrix.label }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            build/Simulator-vision.xcresult
            build/*.txt
            build/probe-runtimes.json
            build/simulators.json
            HangInThereTests/Fixtures/generated/prepared.json
