name: Review exercise source media
on:
  push:
    branches: [ops/review-exercise-sources-20260927]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv /tmp/review-env
          /tmp/review-env/bin/pip install --only-binary=:all: Pillow==12.3.0
      - name: Acquire reviewed original URLs without inference
        run: |
          /tmp/review-env/bin/python - <<'PY'
          import hashlib, io, json, subprocess, time, urllib.parse, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps
          # Original links and rights were reviewed on the five Commons pages.
          # No discovery/API requests or retries after server rate-limit errors.
          sources = [
            ('dip_front', 'Barbells, Dumbbells, Kettlebells, Oh My! 110823-M-ED643-008.jpg', 'c/ca', '50c1b48171193cdb9deceb07efb082b7bb27ee21', 'U.S. Marine Corps / Cpl. Colby Brown', 'PD-US-Marines'),
            ('dip_cropped', 'Fitness Through the Holidays DVIDS346620.jpg', '2/2b', None, 'U.S. Marine Corps / Cpl. Anthony Ward Jr', 'PD-US-Marines'),
            ('bench_control', 'Girl doing dips Exercise.jpg', 'c/cb', 'd923a59bf140083769b552dc259e5992b453a9d7', 'PTPioneer / Tyler Read, https://www.ptpioneer.com/', 'CC-BY-2.0'),
            ('pullup_back', 'Pull-ups exercise from back.jpg', 'd/d6', 'd48df0a85e788c4c8b1f1899c2be00b1e449bcb4', 'PTPioneer / Tyler Read, https://www.ptpioneer.com/', 'CC-BY-2.0'),
            ('pullup_video', 'Pull-ups - exercise demonstration video.webm', '1/15', None, 'FitnessScape; source YouTube 0I6q9NqK9tM', 'CC-BY-3.0'),
          ]
          root = Path('build/source-review'); root.mkdir(parents=True)
          def sha(data): return hashlib.sha256(data).hexdigest()
          records = []
          for identifier, title, prefix, expected_sha1, credit, licence in sources:
              url = 'https://upload.wikimedia.org/wikipedia/commons/'+prefix+'/'+urllib.parse.quote(title.replace(' ','_'), safe='')
              req = urllib.request.Request(url, headers={'User-Agent':'HangInThere/0.1 (https://github.com/yongkyuns/HangInThere; test media review)'})
              with urllib.request.urlopen(req, timeout=90) as r: data = r.read(20_000_001)
              assert 0 < len(data) < 20_000_000
              actual_sha1 = hashlib.sha1(data).hexdigest()
              if expected_sha1 is not None:
                  assert actual_sha1 == expected_sha1, (identifier, actual_sha1, expected_sha1)
              directory = root / identifier; directory.mkdir()
              source = directory / ('original'+Path(title).suffix); source.write_bytes(data)
              frames = []
              if title.endswith('.webm'):
                  probe = json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_frames','-show_entries','frame=best_effort_timestamp_time','-of','json',str(source)]))
                  indices = list(range(0, len(probe['frames']), 4))
                  subprocess.run(['ffmpeg','-v','error','-i',str(source),'-vf','select=not(mod(n\\,4)),scale=960:540:flags=lanczos','-fps_mode','passthrough','-start_number','0',str(directory/'%04d.png')],check=True)
                  for i, path in enumerate(sorted(directory.glob('*.png'))):
                      frames.append({'path':str(path.relative_to(root)), 'source_frame_index':indices[i], 'source_pts_seconds':float(probe['frames'][indices[i]]['best_effort_timestamp_time']), 'sha256':sha(path.read_bytes())})
                  assert len(frames) == len(indices)
              else:
                  with Image.open(io.BytesIO(data)) as im:
                      upright = ImageOps.exif_transpose(im).convert('RGB')
                      ratio = min(1, 960/max(upright.size))
                      size = tuple(round(d*ratio) for d in upright.size)
                      upright = upright.resize(size, Image.Resampling.LANCZOS)
                      clean = Image.frombytes('RGB', upright.size, upright.tobytes())
                      path = directory/'0000.png'; clean.save(path)
                  frames.append({'path':str(path.relative_to(root)), 'sha256':sha(path.read_bytes())})
              records.append({'id':identifier,'title':title,'source_page':'https://commons.wikimedia.org/wiki/File:'+urllib.parse.quote(title.replace(' ','_')), 'credit':credit,'licence':licence,'source_url':url,'source_sha1':actual_sha1,'source_sha256':sha(data),'source_bytes':len(data),'frames':frames,'scope':'Visual review only, no model predictions or validity labels; no endorsement or marketing use.'})
              time.sleep(5)
          (root/'sources.json').write_text(json.dumps(records,indent=2,sort_keys=True)+'\n')
          (root/'ATTRIBUTION.txt').write_text('\n\n'.join(f"{r['id']}: {r['title']}\n{r['credit']}\n{r['source_page']}\n{r['licence']}\nChanged: selected frames, oriented/resized RGB PNG derivatives for test-only visual review. No endorsement." for r in records)+'\n\nCC-BY-2.0: https://creativecommons.org/licenses/by/2.0/\nCC-BY-3.0: https://creativecommons.org/licenses/by/3.0/\nPD-US-Marines: U.S. official-duty government work, public-domain status recorded by Commons; no endorsement; see https://www.dvidshub.net/about/copyright\n')
          print(json.dumps([{'id':r['id'],'frames':len(r['frames']),'source_sha256':r['source_sha256']} for r in records],indent=2))
          PY
      - name: Retain only selected reviewed-source media
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-review
          retention-days: 3
          path: build/source-review
          if-no-files-found: error
