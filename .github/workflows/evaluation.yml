name: Dataset evaluation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  batch:
    name: Manifest, scoring and real-pipeline batch smoke
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retain exact tracked source snapshot
        run: |
          mkdir -p build
          git archive --format=zip HEAD -o build/evaluation-source.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluation-source
          retention-days: 7
          path: build/evaluation-source.zip
      - name: Install isolated host-only annotation dependencies
        run: |
          python3 -m venv /tmp/hit-import-env
          /tmp/hit-import-env/bin/python -m pip install --only-binary=:all: -r Evaluation/import-requirements.txt
          echo "/tmp/hit-import-env/bin" >> "$GITHUB_PATH"
      - name: Validate evaluator and importer contracts
        run: python3 -m unittest discover -s Evaluation/tests -v
      - name: Prepare already-approved motion fixture
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 scripts/prepare-fixtures.py
          mkdir -p build
          python3 scripts/evaluation.py smoke-manifest --root "$PWD" --output build/batch-smoke.json
      - name: Run actual production pipeline in batch mode
        run: |
          xcodebuild -version > build/batch-toolchain.txt
          xcrun swift --version >> build/batch-toolchain.txt
          ./scripts/evaluate.sh build/batch-smoke.json --root "$PWD" --output Evaluation/output/ci-smoke --public-output
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('Evaluation/output/ci-smoke')
          report = json.loads((root / 'report.json').read_text())
          assert report['counts_by_status'] == {'processed': 1}
          row = report['clips'][0]
          assert row['frames'] == 40
          assert row['pose_metrics']['status'] == 'no_independent_labels'
          assert row['rep_metrics']['status'] == 'not_implemented'
          frames = [json.loads(line) for line in (root / 'pullup_smoke/observations.jsonl').read_text().splitlines()]
          assert any(any({'leftShoulder','leftElbow','leftWrist'} <= {
              p['joint'] for p in person['landmarks'] if p['confidence'] >= .2
          } for person in frame['people']) for frame in frames), 'Real visible arm required; not a request-only smoke test'
          assert frames[-1]['timestamp']['value'] / frames[-1]['timestamp']['timescale'] == 3.9
          print('Real video batch smoke passed; no pose accuracy or counting score claimed.')
          PY
      - name: Diagnose movement count on freshly inferred video poses
        run: |
          ./scripts/count-replay.sh Evaluation/output/ci-smoke/pullup_smoke/observations.jsonl pullUp left build/pullup-movement-diagnostic.json
          python3 - <<'PY_COUNT'
          import json
          from pathlib import Path
          report = json.loads(Path('build/pullup-movement-diagnostic.json').read_text())
          assert report['frames'] == 40
          assert report['summary']['formVerification'] == 'unverified'
          print('Real-video counter output retained; not an accuracy or strict-form gate.')
          PY_COUNT
      - name: Evaluate frozen three-interval image pilot
        run: |
          python3 scripts/prepare-pilot.py --source Data/external/p0-pullup-source.webm --output Data/local/public-pilot
          ./scripts/evaluate.sh Data/local/public-pilot/manifest.json --root Data/local/public-pilot --output Evaluation/output/ci-image-pilot --public-output
          python3 - <<'PY_CHECK'
          import json
          from pathlib import Path
          root = Path('Evaluation/output/ci-image-pilot')
          report = json.loads((root / 'report.json').read_text())
          assert report['counts_by_status'] == {'processed': 3}
          assert [c['frames'] for c in report['clips']] == [30, 30, 40]
          assert sum(m['reference_count'] for c in report['clips'] for m in c['pose_metrics']['joint_pixels'].values()) == 46
          assert all(c['pose_metrics']['status'] == 'measured_2d_only' for c in report['clips'])
          for clip in report['clips']:
              reference = json.loads((Path('Data/local/public-pilot/labels') / (clip['id'] + '.json')).read_text())
              assert reference['provenance'].startswith('Single assistant visual')
          for clip in report['clips']:
              frames = [json.loads(l) for l in (root / clip['id'] / 'observations.jsonl').read_text().splitlines()]
              assert all(f['timebase'] == 'frame_index' and f.get('timestamp') is None for f in frames)
              assert any(f['people'] for f in frames), 'Actual human observations required'
          print('Three same-source intervals / 100 images / 46 approximate reference points; not held-out accuracy qualification.')
          PY_CHECK
      - name: Evaluate separately reviewed dip and pull-up sources
        run: |
          python3 scripts/prepare-source-pilot.py --cache Data/external/source-pilot --fetch --output Data/local/source-pilot
          ./scripts/evaluate.sh Data/local/source-pilot/manifest.json --root Data/local/source-pilot --output Evaluation/output/ci-source-pilot --public-output
          python3 - <<'PY_SOURCES'
          import json
          from pathlib import Path
          report = json.loads(Path('Evaluation/output/ci-source-pilot/report.json').read_text())
          assert report['counts_by_status'] == {'processed': 5}
          assert [c['frames'] for c in report['clips']] == [1, 1, 1, 1, 45]
          assert sum(m['reference_count'] for c in report['clips'] for m in c['pose_metrics']['joint_pixels'].values()) == 38
          assert all(c['pose_metrics']['status'] == 'measured_2d_only' for c in report['clips'])
          assert all(c['split'] == 'unassigned' and c['subject_group'] is None for c in report['clips'])
          assert [c['exercise'] for c in report['clips']] == ['parallel_bar_dip', 'parallel_bar_dip', 'bench_dip', 'pull_up', 'pull_up']
          print('49 new-source images / 38 approximate references; still dips are NOT temporal/form qualification.')
          PY_SOURCES
      - name: Audit guided bar proposals on reviewed source images
        run: |
          xcrun swiftc -O -swift-version 6 -parse-as-library \
            HangInThere/Analysis/*.swift HangInThere/Pose/VisionBarDetector.swift \
            Evaluation/BarSetupAudit.swift -o build/bar-setup-audit
          build/bar-setup-audit Evaluation/fixtures/bar-setup.json \
            Data/local/source-pilot Evaluation/output/bar-setup/report.json
          shasum -a 256 HangInThere/Analysis/BarGeometry.swift \
            HangInThere/Pose/VisionBarDetector.swift Evaluation/BarSetupAudit.swift \
            Evaluation/fixtures/bar-setup.json build/bar-setup-audit > build/bar-setup-provenance.txt
      - name: Inventory HAA4D public metadata
        if: ${{ !cancelled() }}
        run: python3 scripts/inventory.py haa4d --fetch --output Evaluation/output/inventory/haa4d.json
      - name: Inventory Countix public metadata
        if: ${{ !cancelled() }}
        run: python3 scripts/inventory.py countix --fetch --output Evaluation/output/inventory/countix.json
      - name: Retain only approved reports and fixture observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataset-evaluation
          retention-days: 7
          path: |
            build/pullup-movement-diagnostic.json
            build/batch-toolchain.txt
            build/bar-setup-provenance.txt
            Evaluation/output/bar-setup/report.json
            build/batch-smoke.json
            Evaluation/output/ci-smoke/report.json
            Evaluation/output/ci-smoke/pullup_smoke/observations.jsonl
            Evaluation/output/ci-smoke/pullup_smoke/completion.json
            Evaluation/output/inventory/haa4d.json
            Evaluation/output/inventory/countix.json
            Evaluation/output/ci-image-pilot/report.json
            Evaluation/output/ci-image-pilot/hang/observations.jsonl
            Evaluation/output/ci-image-pilot/descent/observations.jsonl
            Evaluation/output/ci-image-pilot/cycle/observations.jsonl
            Data/local/public-pilot/prepared.json
            Data/local/public-pilot/manifest.json
            Data/local/public-pilot/labels/*.json
            Data/local/public-pilot/hang/*.png
            Data/local/public-pilot/descent/*.png
            Data/local/public-pilot/cycle/*.png
            Data/local/source-pilot/manifest.json
            Data/local/source-pilot/prepared.json
            Data/local/source-pilot/ATTRIBUTION.txt
            Data/local/source-pilot/labels/*.json
            Data/local/source-pilot/dip_front/*.png
            Data/local/source-pilot/dip_cropped/*.png
            Data/local/source-pilot/bench_control/*.png
            Data/local/source-pilot/pullup_back/*.png
            Data/local/source-pilot/pullup_video/*.png
            Evaluation/output/ci-source-pilot/report.json
            Evaluation/output/ci-source-pilot/*/observations.jsonl
            Evaluation/output/ci-source-pilot/*/completion.json


  mediapipe-compare:
    name: MediaPipe Heavy same-pixel comparison
    needs: batch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact Vision pilot pixels and report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dataset-evaluation
          path: build/vision-artifact
      - name: Install host-only MediaPipe runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgles2
          python3 -m venv /tmp/hit-mediapipe-env
          /tmp/hit-mediapipe-env/bin/python -m pip install --only-binary=:all: -r Evaluation/mediapipe-requirements.txt
      - name: Verify model and run identical labelled images
        run: |
          /tmp/hit-mediapipe-env/bin/python scripts/prepare-mediapipe-model.py \
            --output /tmp/hit-models/pose_landmarker_heavy.task \
            --metadata build/mediapipe-model.json
          /tmp/hit-mediapipe-env/bin/python scripts/mediapipe_eval.py \
            build/vision-artifact/Data/local/public-pilot/manifest.json \
            --root build/vision-artifact/Data/local/public-pilot \
            --output Evaluation/output/ci-image-pilot-mediapipe \
            --model /tmp/hit-models/pose_landmarker_heavy.task --public-output
          python3 scripts/compare-pose-reports.py \
            build/vision-artifact/Evaluation/output/ci-image-pilot/report.json \
            Evaluation/output/ci-image-pilot-mediapipe/report.json \
            --output Evaluation/output/ci-image-pilot-backend-comparison.json
          python3 - <<'PY_COMPARE'
          import json
          from pathlib import Path
          mp = json.loads(Path('Evaluation/output/ci-image-pilot-mediapipe/report.json').read_text())
          comparison = json.loads(Path('Evaluation/output/ci-image-pilot-backend-comparison.json').read_text())
          assert mp['counts_by_status'] == {'processed': 3}
          assert mp['backend'] == ['MediaPipe Pose Landmarker Heavy', 'pose_landmarker_heavy/float16/1']
          assert mp['options']['num_poses'] == 2 and mp['options']['delegate'] == 'CPU'
          assert comparison['schema_version'] == 2 and comparison['timing_comparable'] is False
          assert sum(c['frames'] for c in mp['clips']) == 100
          assert all(c['pose_metrics']['status'] == 'measured_2d_only' for c in mp['clips'])
          assert len(comparison['clips']) == 3
          assert all(c['reference_points'] > 0 for c in comparison['clips'])
          print('MediaPipe Heavy same-pixel comparison complete; no iOS throughput or winner claim.')
          PY_COMPARE
      - name: Compare the same separately reviewed source images
        run: |
          /tmp/hit-mediapipe-env/bin/python scripts/mediapipe_eval.py \
            build/vision-artifact/Data/local/source-pilot/manifest.json \
            --root build/vision-artifact/Data/local/source-pilot \
            --output Evaluation/output/ci-source-pilot-mediapipe \
            --model /tmp/hit-models/pose_landmarker_heavy.task --public-output
          python3 scripts/compare-pose-reports.py \
            build/vision-artifact/Evaluation/output/ci-source-pilot/report.json \
            Evaluation/output/ci-source-pilot-mediapipe/report.json \
            --output Evaluation/output/ci-source-pilot-backend-comparison.json
          python3 - <<'PY_SOURCES'
          import json
          from pathlib import Path
          report = json.loads(Path('Evaluation/output/ci-source-pilot-mediapipe/report.json').read_text())
          comparison = json.loads(Path('Evaluation/output/ci-source-pilot-backend-comparison.json').read_text())
          assert report['counts_by_status'] == {'processed': 5}
          assert [c['frames'] for c in report['clips']] == [1, 1, 1, 1, 45]
          assert sum(c['reference_points'] for c in comparison['clips']) == 38
          assert len(comparison['clips']) == 5 and not comparison['timing_comparable']
          print('Separate-source comparison complete; coverage/error retained, no winner or strict-rep claim.')
          PY_SOURCES
      - name: Retain MediaPipe comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mediapipe-comparison
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/mediapipe-model.json
            Evaluation/output/ci-image-pilot-mediapipe/report.json
            Evaluation/output/ci-image-pilot-mediapipe/hang/observations.jsonl
            Evaluation/output/ci-image-pilot-mediapipe/descent/observations.jsonl
            Evaluation/output/ci-image-pilot-mediapipe/cycle/observations.jsonl
            Evaluation/output/ci-image-pilot-mediapipe/hang/completion.json
            Evaluation/output/ci-image-pilot-mediapipe/descent/completion.json
            Evaluation/output/ci-image-pilot-mediapipe/cycle/completion.json
            Evaluation/output/ci-image-pilot-backend-comparison.json
            Evaluation/output/ci-source-pilot-mediapipe/report.json
            Evaluation/output/ci-source-pilot-mediapipe/*/observations.jsonl
            Evaluation/output/ci-source-pilot-mediapipe/*/completion.json
            Evaluation/output/ci-source-pilot-backend-comparison.json
            build/vision-artifact/Data/local/source-pilot/ATTRIBUTION.txt
