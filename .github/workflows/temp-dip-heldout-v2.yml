name: TEMP dip holdout v2 qualification

on:
  pull_request:

permissions:
  contents: read

jobs:
  heldout:
    name: Pavel dip held-out v2
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify frozen policy and prepare untouched holdout
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          root=pathlib.Path('.')
          freeze=json.loads((root/'HangInThereTests/Fixtures/dip-policy-v6-freeze.json').read_text())
          h=json.loads((root/'HangInThereTests/Fixtures/dip-heldout-v2.json').read_text())
          c=h['case']
          assert freeze['status']=='frozen-before-heldout-v2-inference'
          assert freeze['counter_policy_version']==6
          assert freeze['untouched_holdout']=='HangInThereTests/Fixtures/dip-heldout-v2.json'
          assert h['status']=='locked-before-inference'
          d=root/'Data/local/pavel-heldout-v2'; d.mkdir(parents=True)
          source=d/'source.mp4'
          req=urllib.request.Request(c['download_url'], headers={
              'User-Agent':'Mozilla/5.0 HangInThere/0.1 heldout-v2',
              'Referer':c['source_page'],
          })
          with urllib.request.urlopen(req, timeout=120) as r, source.open('wb') as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          data=source.read_bytes()
          assert len(data)==c['source_bytes']
          assert hashlib.sha256(data).hexdigest()==c['source_sha256']
          PY
          ffmpeg -v error -y -i Data/local/pavel-heldout-v2/source.mp4 \
            -t 14 -vf 'fps=8,scale=640:-2:flags=lanczos' -an \
            -c:v libx264 -crf 18 -preset veryfast \
            Data/local/pavel-heldout-v2/pavel.mp4
          test "$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 Data/local/pavel-heldout-v2/pavel.mp4)" = "112"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('Data/local/pavel-heldout-v2/pavel.mp4')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          m={'schema_version':1,'clips':[{
            'id':'pavel_heldout_v2',
            'dataset':'dip-heldout-v2',
            'exercise':'parallel_bar_dip',
            'split':'heldout',
            'source_group':'Pexels-4065479',
            'subject_group':'Pavel-Danilyuk-Pexels-4065479',
            'rights':{'status':'approved','evidence':'Pavel Danilyuk / Pexels; Pexels License; one-time held-out qualification.','public_outputs':True},
            'media':{'kind':'video','files':[{'path':'pavel.mp4','sha256':sha}],'expected_frames':112}
          }]}
          Path('Data/local/pavel-heldout-v2/manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
          rm Data/local/pavel-heldout-v2/source.mp4
      - name: Run first Apple Vision exposure
        run: |
          ./scripts/evaluate.sh Data/local/pavel-heldout-v2/manifest.json \
            --root Data/local/pavel-heldout-v2 \
            --output Evaluation/output/pavel-heldout-v2-poses \
            --public-output
      - name: Check locked tracking floors
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('Evaluation/output/pavel-heldout-v2-poses/pavel_heldout_v2/observations.jsonl')
          rows=[json.loads(x) for x in p.read_text().splitlines()]
          assert len(rows)==112
          people=sum(bool(r['people']) for r in rows)
          arms=sum(any(a.get('estimate') is not None for a in r['armMeasurements']) for r in rows)
          assert all(r['imageSize']['width'] > r['imageSize']['height'] for r in rows)
          pf=people/len(rows); af=arms/len(rows)
          print(f'Pavel heldout v2 coverage: people={people}/112 ({pf:.6f}); any-arm={arms}/112 ({af:.6f})')
          assert pf >= .95
          assert af >= .85
          PY
      - name: Run frozen policy v6 counter
        run: |
          ./scripts/count-replay.sh \
            Evaluation/output/pavel-heldout-v2-poses/pavel_heldout_v2/observations.jsonl \
            dip right Evaluation/output/pavel-heldout-v2-counter.json \
            20 315 620 290
          cat Evaluation/output/pavel-heldout-v2-counter.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('Evaluation/output/pavel-heldout-v2-counter.json').read_text())
          s=r['summary']
          assert r['frames']==112
          assert s['policyVersion']==6
          assert s['observedMovements']==3
          assert s['partialAttempts']==0
          assert s['interruptedAttempts']==0
          assert s['phase']=='finished'
          PY
      - name: Retain first held-out result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temp-dip-heldout-v2-result
          retention-days: 7
          if-no-files-found: warn
          path: |
            HangInThereTests/Fixtures/dip-policy-v6-freeze.json
            HangInThereTests/Fixtures/dip-heldout-v2.json
            Data/local/pavel-heldout-v2/manifest.json
            Evaluation/output/pavel-heldout-v2-poses/report.json
            Evaluation/output/pavel-heldout-v2-poses/pavel_heldout_v2/completion.json
            Evaluation/output/pavel-heldout-v2-poses/pavel_heldout_v2/observations.jsonl
            Evaluation/output/pavel-heldout-v2-counter.json
