name: Authorized private Android evaluation
on:
  # Register a new branch workflow without exposing private inputs to push runs.
  push:
    branches: ['codex/android-parity']
    paths: ['.github/workflows/android-private.yml']
  workflow_dispatch:
    inputs:
      encrypted_release:
        description: Temporary release containing inputs.tar.age
        required: true
        type: string
      encrypted_sha256:
        description: SHA256 of the encrypted input archive
        required: true
        type: string
      report_recipient:
        description: Public age recipient; report decryption key stays on the authorizing Mac
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: private-android-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  imported:
    # Private inputs are never available to PR events or another actor/ref.
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.ref == 'refs/heads/codex/android-parity'
    environment: android-private-evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    env:
      PRIVATE_WORK: ${{ github.workspace }}/build/authorized-private-evaluation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: ''
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          # Test APKs embed authorized media; no private intermediate may enter a cache.
          cache-disabled: true
      - name: Install pinned encryption tool and prepare model
        run: |
          umask 077
          mkdir -p "$PRIVATE_WORK/evidence" "$RUNNER_TEMP/private-age"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/private-age/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
          printf '%s  %s\n' 7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50 "$RUNNER_TEMP/private-age/age.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/private-age/age.tar.gz" -C "$RUNNER_TEMP/private-age"
          echo "$RUNNER_TEMP/private-age/age" >> "$GITHUB_PATH"
          python3 scripts/prepare-mediapipe-model.py --output android/app/src/main/assets/pose_landmarker_heavy.task --metadata "$PRIVATE_WORK/evidence/model.json"
      - name: Verify and decrypt authorized input
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE: ${{ inputs.encrypted_release }}
          INPUT_SHA256: ${{ inputs.encrypted_sha256 }}
          AGE_IDENTITY: ${{ secrets.ANDROID_PRIVATE_EVAL_AGE_IDENTITY }}
        run: |
          umask 077
          [[ "$INPUT_RELEASE" =~ ^android-private-input-[a-z0-9-]+$ ]]
          [[ "$INPUT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ -n "$AGE_IDENTITY" ]]
          trap 'rm -f "$PRIVATE_WORK/input-key.txt" "$PRIVATE_WORK/inputs.tar"' EXIT
          gh release download "$INPUT_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern inputs.tar.age --dir "$PRIVATE_WORK"
          printf '%s  %s\n' "$INPUT_SHA256" "$PRIVATE_WORK/inputs.tar.age" | sha256sum --check --status
          printf '%s\n' "$AGE_IDENTITY" > "$PRIVATE_WORK/input-key.txt"
          age --decrypt --identity "$PRIVATE_WORK/input-key.txt" --output "$PRIVATE_WORK/inputs.tar" "$PRIVATE_WORK/inputs.tar.age"
          python3 scripts/private-android-ci.py unpack "$PRIVATE_WORK/inputs.tar" android/app/src/androidTest/assets/generated/private-evaluation
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['PRIVATE_WORK'], 'evidence', 'ci-provenance.json').write_text(json.dumps({
              'implementationCommit': os.environ['GITHUB_SHA'], 'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'workflowRunAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'encryptedInputSha256': os.environ['INPUT_SHA256']
          }, indent=2)+'\n')
          PY
      - name: Compile private test APK without caches
        run: |
          ./gradlew :android:app:assembleDebug :android:app:assembleDebugAndroidTest --no-build-cache --console=plain > "$PRIVATE_WORK/evidence/build.log" 2>&1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Evaluate authorized recordings using real native adapters
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-private-android-evaluation.sh
      - name: Encrypt detailed results for the authorizing Mac
        if: always()
        env:
          REPORT_RECIPIENT: ${{ inputs.report_recipient }}
        run: |
          umask 077
          mkdir -p "$PRIVATE_WORK/evidence" build/private-android-encrypted
          python3 scripts/private-android-ci.py summary "$PRIVATE_WORK/evidence/private-evaluation/report.json" "$PRIVATE_WORK/evidence/summary.json" --instrumentation-status "$PRIVATE_WORK/evidence/instrumentation-exit-status.txt" --collection-status "$PRIVATE_WORK/evidence/collection-exit-status.txt"
          cp "$PRIVATE_WORK/evidence/summary.json" build/private-android-encrypted/summary.json
          tar -cf "$PRIVATE_WORK/results.tar" -C "$PRIVATE_WORK/evidence" .
          age --recipient "$REPORT_RECIPIENT" --output build/private-android-encrypted/results.tar.age "$PRIVATE_WORK/results.tar"
      - name: Remove private plaintext and embedded test assets
        if: always()
        run: |
          rm -rf "$PRIVATE_WORK" android/app/src/androidTest/assets/generated/private-evaluation android/app/build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: private-android-api-${{ matrix.api }}
          if-no-files-found: error
          retention-days: 2
          # The public summary contains only anonymous counts/status. All derived evidence is encrypted.
          path: |
            build/private-android-encrypted/summary.json
            build/private-android-encrypted/results.tar.age
