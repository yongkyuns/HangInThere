name: Debug session contracts

on:
  pull_request:
    paths:
      - 'scripts/debug_session.py'
      - 'scripts/tests/test_debug_session.py'
      - 'Evaluation/DEBUG_SESSION.md'
      - 'HangInThere/UI/QualificationReportDocument.swift'
      - 'HangInThere/Capture/LiveCameraPreview.swift'
      - 'HangInThere/UI/LiveSetupView.swift'
      - 'HangInThere/Analysis/LiveSetSession.swift'
      - 'HangInThereTests/Core/LiveDeviceQualificationRecorderTests.swift'
      - 'HangInThereTests/Core/LiveSetSessionTests.swift'
      - '.github/workflows/debug-session.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/debug_session.py'
      - 'scripts/tests/test_debug_session.py'
      - 'Evaluation/DEBUG_SESSION.md'
      - '.github/workflows/debug-session.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test package verification and manifest generation
        run: python3 -m unittest scripts/tests/test_debug_session.py -v
