name: Bar single-edge audit
on:
  push:
    branches: [ops/bar-single-edge-audit-20260927]
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare exact reviewed source pixels
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 -m venv /tmp/bar-audit
          /tmp/bar-audit/bin/pip install --only-binary=:all: Pillow==12.3.0
          PYTHONPATH=scripts /tmp/bar-audit/bin/python scripts/prepare-source-pilot.py \
            --cache Data/external/source-pilot --fetch --output Data/local/source-pilot
      - name: Compile and run exact guided detector audit
        run: |
          mkdir -p build/bar-audit
          xcrun swiftc -O -swift-version 6 -parse-as-library \
            HangInThere/Analysis/*.swift HangInThere/Pose/VisionBarDetector.swift \
            Evaluation/BarSetupAudit.swift -o build/bar-audit/bar-setup-audit
          build/bar-audit/bar-setup-audit Evaluation/fixtures/bar-setup.json \
            Data/local/source-pilot build/bar-audit/report.json
          cat build/bar-audit/report.json
          shasum -a 256 HangInThere/Analysis/BarGeometry.swift \
            HangInThere/Pose/VisionBarDetector.swift Evaluation/BarSetupAudit.swift \
            Evaluation/fixtures/bar-setup.json build/bar-audit/bar-setup-audit \
            > build/bar-audit/provenance.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bar-single-edge-audit
          retention-days: 3
          path: build/bar-audit
          if-no-files-found: error
