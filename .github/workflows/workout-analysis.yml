name: Shared workout analysis
on:
  pull_request:
  push:
    branches: [main, 'codex/android-parity']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workout-analysis-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  common-and-apple-bridge:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Shared metrics, lifecycle and persistence contract tests
        run: ./gradlew -Pworkout.appleOnly=true :shared:jvmTest --console=plain
      - name: Shipping Kotlin to Swift bridge and host performance budget
        run: ./scripts/test-workout-bridge.sh
      - name: Render shipping Swift Charts view in narrow/wide and light/dark layouts
        run: ./scripts/render-workout-review.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workout-analysis-contracts
          path: |
            build/workout-analysis/apple-bridge-check.json
            build/workout-analysis/render/*.png
            shared/build/test-results/jvmTest/*.xml
