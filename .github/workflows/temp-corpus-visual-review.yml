name: TEMP corpus visual review

on:
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Prepare existing fixture and diversity corpus
        run: |
          python3 scripts/prepare-fixtures.py
          python3 scripts/prepare-video-corpus.py
      - name: Upload visual-review corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temp-real-video-corpus-review
          retention-days: 1
          path: |
            HangInThereTests/Fixtures/corpus.json
            HangInThereTests/Fixtures/generated/corpus/
